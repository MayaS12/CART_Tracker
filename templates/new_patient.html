{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>New patient</h1>
  <form method="post">

    <fieldset>
      <legend>Demographics</legend>
      <div class="grid2">
        <label>Patient name <input name="name" placeholder="Full name"></label>
        <label>Patient code / UHID <input name="code" required placeholder="e.g. CK1326"></label>
      </div>
      <div class="grid2">
        <label>Age <input name="age" type="number"></label>
        <label>Sex
          <select name="sex"><option value="M">M</option><option value="F">F</option></select>
        </label>
      </div>
      <div class="grid2">
        <label>Treating center <input name="treating_center" placeholder="e.g. Tata Memorial Hospital"></label>
        <label>Referring center (if different) <input name="referring_center" placeholder="e.g. Ruby Hall Clinic"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Diagnosis</legend>
      <div class="grid2">
        <label>Diagnosis <input name="diagnosis" placeholder="e.g. B-ALL, relapsed"></label>
        <label>Subtype <input name="diagnosis_subtype" placeholder="e.g. BCP-ALL"></label>
      </div>
      <div class="grid2">
        <label>Baseline cytogenetics <input name="cytogenetics_baseline" placeholder="e.g. IKZF1 deletion del(7p12.2), 40% cells"></label>
        <label>Relapse date <input name="relapse_date" type="date"></label>
      </div>
      <label>Disease history (dx date, prior lines of therapy, course to relapse)
        <textarea name="disease_history" rows="5"></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>CAR-T plan</legend>
      <div class="grid2">
        <label>CAR-T product <input name="car_t_product" placeholder="e.g. NexCAR19"></label>
        <label>Planned dose <input name="planned_dose" placeholder="e.g. 5.5 x 10^6 cells/kg"></label>
      </div>
      <div class="grid2">
        <label>Central line <input name="central_line_type" placeholder="e.g. Right IJV catheter / PICC"></label>
        <label>Central line placed on <input name="central_line_date" type="date"></label>
      </div>
      <label>Infusion date (leave blank if not yet infused)
        <input name="infusion_date" type="date">
      </label>
    </fieldset>

    <button type="submit">Create patient</button>
  </form>
</div>
{% endblock %}
