{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>New patient</h1>
  <form method="post" enctype="multipart/form-data" id="patient-form">

    <fieldset>
      <legend>Demographics</legend>
      <div class="grid2">
        <label>Patient name <input name="name" placeholder="Full name"></label>
        <label>Patient code / UHID <input name="code" required placeholder="e.g. CK1326"></label>
      </div>
      <div class="grid2">
        <label>Age <input name="age" type="number"></label>
        <label>Sex
          <select name="sex"><option value="M">M</option><option value="F">F</option></select>
        </label>
      </div>
      <div class="grid2">
        <label>Treating center <input name="treating_center" placeholder="e.g. Tata Memorial Hospital"></label>
        <label>Referring center (if different) <input name="referring_center" placeholder="e.g. Ruby Hall Clinic"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Diagnosis</legend>
      <div class="grid2">
        <label>Baseline diagnosis <input name="diagnosis" placeholder="e.g. B-ALL, relapsed"></label>
        <label>Subtype <input name="diagnosis_subtype" placeholder="e.g. BCP-ALL"></label>
      </div>
      <div class="grid2">
        <label>Cytogenetics <input name="cytogenetics_baseline" placeholder="e.g. IKZF1 deletion del(7p12.2), 40% cells"></label>
        <label>Relapse date (if relapsed) <input name="relapse_date" type="date"></label>
      </div>
      <label>Molecular report <textarea name="molecular_report" rows="2"></textarea></label>
      <label>Indication for CAR-T <textarea name="indication_for_cart" rows="2"></textarea></label>
      <label>Disease history (dx date, prior lines of therapy, course to relapse)
        <textarea name="disease_history" rows="4"></textarea>
      </label>

      <label>Disease status
        <select name="disease_status" id="disease-status-select">
          <option value="">—</option>
          <option value="B-cell ALL">B-cell ALL</option>
          <option value="B-cell lymphomas">B-cell lymphomas</option>
        </select>
      </label>

      <div id="disease-reports-upload">
        <label>Upload disease report(s) <input type="file" name="disease_reports" accept="image/*,video/*,application/pdf" multiple></label>
      </div>

      <div id="all-branch" class="disease-branch">
        <h4>B-cell ALL details</h4>
        <div class="grid3">
          <label>% Blast (Bone Marrow) <input name="all_blast_pct" type="number" step="0.01"></label>
          <label>MRD assessment <input name="all_mrd_assessment" placeholder="value"></label>
          <label>CSF assessment done? <select name="all_csf_assessment_done" id="all-csf-done"><option value="">—</option><option value="yes">Yes</option><option value="no">No</option></select></label>
        </div>
        <div id="all-csf-involved-wrap" style="display:none">
          <label>CSF involved? <select name="all_csf_involved"><option value="">—</option><option value="yes">Yes</option><option value="no">No</option></select></label>
        </div>
      </div>

      <div id="lymphoma-branch" class="disease-branch">
        <h4>B-cell lymphoma details</h4>
        <div class="grid2">
          <label>Disease stage <input name="lymphoma_disease_stage"></label>
          <label>LDH <input name="lymphoma_ldh" type="number" step="0.01"></label>
        </div>
        <div class="grid2">
          <label>Supradiaphragmatic nodes <textarea name="lymphoma_supradiaphragmatic_nodes" rows="2"></textarea></label>
          <label>Infradiaphragmatic nodes <textarea name="lymphoma_infradiaphragmatic_nodes" rows="2"></textarea></label>
        </div>
        <div class="grid3">
          <label>Extranodal disease? <select name="lymphoma_extranodal_disease"><option value="">—</option><option value="yes">Yes</option><option value="no">No</option></select></label>
          <label>Bulky disease? <select name="lymphoma_bulky_disease" id="lymphoma-bulky-select"><option value="">—</option><option value="yes">Yes</option><option value="no">No</option></select></label>
          <label>Bone marrow involvement? <select name="lymphoma_bm_involvement"><option value="">—</option><option value="yes">Yes</option><option value="no">No</option></select></label>
        </div>
        <div id="lymphoma-bulky-size-wrap" style="display:none">
          <label>Bulky disease size <input name="lymphoma_bulky_size"></label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Prior lines of therapy</legend>
      <table class="med-table" id="line-table">
        <thead><tr><th>Cycle start</th><th>Cycle stop</th><th>Drugs &amp; dose administered</th><th>Response assessment</th><th></th></tr></thead>
        <tbody id="line-table-body"></tbody>
      </table>
      <button type="button" class="btn secondary small-btn" id="add-line-row">+ Add line of therapy</button>
    </fieldset>

    <fieldset>
      <legend>CAR-T plan</legend>
      <div class="grid2">
        <label>CAR-T product <input name="car_t_product" placeholder="e.g. NexCAR19"></label>
        <label>Planned dose <input name="planned_dose" placeholder="e.g. 5.0 x 10^6 cells/kg"></label>
      </div>
      <div class="grid2">
        <label>Central line <input name="central_line_type" placeholder="e.g. Right IJV catheter / PICC"></label>
        <label>Central line placed on <input name="central_line_date" type="date"></label>
      </div>
      <label>Infusion date (leave blank if not yet infused)
        <input name="infusion_date" type="date">
      </label>
    </fieldset>

    <button type="submit">Create patient</button>
  </form>
</div>

<template id="line-row-template">
  <tr>
    <td><input name="line_start" type="date"></td>
    <td><input name="line_stop" type="date"></td>
    <td><input name="line_drugs_dose"></td>
    <td><input name="line_response"></td>
    <td><button type="button" class="btn secondary small-btn remove-row">Remove</button></td>
  </tr>
</template>

<script>
(function () {
  var diseaseSelect = document.getElementById('disease-status-select');
  var allBranch = document.getElementById('all-branch');
  var lymphomaBranch = document.getElementById('lymphoma-branch');

  function applyDiseaseBranch() {
    allBranch.style.display = (diseaseSelect.value === 'B-cell ALL') ? 'block' : 'none';
    lymphomaBranch.style.display = (diseaseSelect.value === 'B-cell lymphomas') ? 'block' : 'none';
  }
  diseaseSelect.addEventListener('change', applyDiseaseBranch);
  applyDiseaseBranch();

  var csfDone = document.getElementById('all-csf-done');
  var csfWrap = document.getElementById('all-csf-involved-wrap');
  function applyCsfWrap() { csfWrap.style.display = (csfDone.value === 'yes') ? 'block' : 'none'; }
  csfDone.addEventListener('change', applyCsfWrap);
  applyCsfWrap();

  var bulkySelect = document.getElementById('lymphoma-bulky-select');
  var bulkySizeWrap = document.getElementById('lymphoma-bulky-size-wrap');
  function applyBulkyWrap() { bulkySizeWrap.style.display = (bulkySelect.value === 'yes') ? 'block' : 'none'; }
  bulkySelect.addEventListener('change', applyBulkyWrap);
  applyBulkyWrap();

  var lineBody = document.getElementById('line-table-body');
  var lineTemplate = document.getElementById('line-row-template');
  document.getElementById('add-line-row').addEventListener('click', function () {
    lineBody.appendChild(lineTemplate.content.cloneNode(true));
  });
  document.getElementById('patient-form').addEventListener('click', function (e) {
    if (e.target.classList.contains('remove-row')) {
      e.target.closest('tr').remove();
    }
  });
})();
</script>
{% endblock %}
